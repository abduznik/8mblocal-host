<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8MBLOCAL // Video Compressor</title>
<script src="coi-serviceworker.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;500;700&display=swap');

  :root {
    --bg: #0d0e0f;
    --surface: #141618;
    --border: #2a2d30;
    --accent: #c8f53c;
    --accent-dim: #8aaa22;
    --text: #d4d8dc;
    --text-muted: #5a6068;
    --danger: #ff4a4a;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Barlow Condensed', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, #ffffff04 39px, #ffffff04 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, #ffffff03 39px, #ffffff03 40px);
  }

  header {
    width: 100%;
    max-width: 720px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 36px;
    display: flex;
    align-items: baseline; gap: 16px;
  }

  header h1 {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 2.6rem;
    letter-spacing: 0.1em;
    color: var(--accent);
    line-height: 1;
  }

  header span {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .card {
    width: 100%;
    max-width: 720px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px;
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  /* Drop zone */
  #dropzone {
    border: 1px dashed var(--border);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }

  #dropzone:hover, #dropzone.drag-over {
    border-color: var(--accent);
    background: #c8f53c08;
  }

  #dropzone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  #dropzone .dz-icon {
    font-size: 2rem;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  #dropzone .dz-text {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  #dropzone .dz-filename {
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--accent);
    font-family: var(--mono);
  }

  /* Settings row */
  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .field label {
    display: block;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .field select, .field input[type="range"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 8px 10px;
    appearance: none;
    outline: none;
    cursor: pointer;
  }

  .field select:focus { border-color: var(--accent); }

  .range-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .range-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  .range-val {
    font-size: 0.9rem;
    color: var(--accent);
    min-width: 40px;
    text-align: right;
  }

  /* Log */
  #log {
    font-size: 0.75rem;
    color: var(--text-muted);
    height: 100px;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 10px 12px;
    line-height: 1.7;
  }

  #log .log-accent { color: var(--accent); }
  #log .log-err { color: var(--danger); }

  /* Progress */
  #progress-wrap {
    margin-top: 12px;
    display: none;
  }

  #progress-bar-bg {
    height: 2px;
    background: var(--border);
    width: 100%;
  }

  #progress-bar {
    height: 2px;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s;
  }

  #progress-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 0.1em;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  button {
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  button:hover:not(:disabled) {
    border-color: var(--text);
    color: var(--text);
  }

  button#compress-btn {
    border-color: var(--accent);
    color: var(--accent);
    flex: 1;
  }

  button#compress-btn:hover:not(:disabled) {
    background: var(--accent);
    color: #000;
  }

  button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* Output */
  #output-section {
    display: none;
  }

  #output-section .out-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 14px;
    line-height: 2;
  }

  #output-section .out-meta span { color: var(--text); }

  #preview-container {
    width: 100%;
    background: #000;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #preview-video {
    width: 100%;
    height: 100%;
    max-height: 400px;
  }

  #download-btn {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  #download-btn:hover {
    background: var(--accent-dim);
    color: #000;
    border-color: var(--accent-dim);
  }

  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    margin-right: 8px;
    vertical-align: middle;
  }

  .status-dot.ready { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-dot.busy { background: #ffaa00; animation: pulse 1s infinite; }
  .status-dot.error { background: var(--danger); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #status-line {
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
  }
</style>
</head>
<body>

<header>
  <h1>8MBLOCAL</h1>
  <span>// local video compressor</span>
</header>

<div id="status-line">
  <span class="status-dot" id="status-dot"></span>
  <span id="status-text">INITIALIZING FFMPEG ENGINE...</span>
</div>

<div class="card">
  <div class="section-label">01 // Input File</div>
  <div id="dropzone">
    <input type="file" id="file-input" accept="video/*">
    <div class="dz-icon">▶</div>
    <div class="dz-text">Drop video file here or click to browse</div>
    <div class="dz-filename" id="dz-filename"></div>
  </div>
</div>

<div class="card">
  <div class="section-label">02 // Compression Settings</div>
  <div class="settings-grid">
    <div class="field">
      <label>Target Size</label>
      <select id="target-size">
        <option value="8">8 MB (Discord Classic)</option>
        <option value="25">25 MB (Discord New)</option>
        <option value="50">50 MB</option>
        <option value="auto">Auto (CRF Based)</option>
      </select>
    </div>
    <div class="field">
      <label>Speed Preset (Lazy = Faster)</label>
      <select id="preset">
        <option value="ultrafast" selected>Ultrafast (Very Lazy)</option>
        <option value="superfast">Superfast</option>
        <option value="veryfast">Veryfast</option>
        <option value="medium">Medium (Accurate)</option>
      </select>
    </div>
    <div class="field" id="crf-field" style="grid-column: 1 / -1; display: none;">
      <label>CRF Quality — lower = better quality, larger file</label>
      <div class="range-row">
        <input type="range" id="crf" min="18" max="40" value="28">
        <span class="range-val" id="crf-val">28</span>
      </div>
    </div>
    <div class="field">
      <label>Resolution Scale</label>
      <select id="scale">
        <option value="original">Original</option>
        <option value="1280">1280px wide</option>
        <option value="854">854px wide (480p)</option>
        <option value="640">640px wide (360p)</option>
      </select>
    </div>
    <div class="field">
      <label>Audio</label>
      <select id="audio">
        <option value="copy">Keep original</option>
        <option value="128k">128k AAC</option>
        <option value="64k">64k AAC</option>
        <option value="none">Remove audio</option>
      </select>
    </div>
  </div>
</div>

<div class="card">
  <div class="section-label">03 // Output Log</div>
  <div id="log"><span class="log-accent">// </span>Waiting for FFmpeg to load...</div>
  <div id="progress-wrap">
    <div id="progress-bar-bg"><div id="progress-bar"></div></div>
    <div id="progress-label" id="progress-label">0%</div>
  </div>
  <div class="btn-row">
    <button id="compress-btn" disabled>▶ Compress</button>
    <button id="reset-btn">↺ Reset</button>
  </div>
</div>

<div class="card" id="output-section">
  <div class="section-label">04 // Preview & Download</div>
  <div id="preview-container">
    <video id="preview-video" controls></video>
  </div>
  <div class="out-meta" id="out-meta"></div>
  <button id="download-btn">↓ Download Output</button>
</div>

<script type="module">
  // ── Load FFmpeg from local self-hosted folders ────────────────────────────
  import { FFmpeg } from './ffmpeg/ffmpeg.js';
  import { fetchFile, toBlobURL } from './util/index.js';

  const ffmpeg = new FFmpeg();
  let loaded = false;
  let inputFile = null;
  let outputURL = null;
  let videoDuration = 0;
  let currentOutputName = '';

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const dot       = document.getElementById('status-dot');
  const statusTxt = document.getElementById('status-text');
  const logEl     = document.getElementById('log');
  const dzName    = document.getElementById('dz-filename');
  const dropzone  = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  const compBtn   = document.getElementById('compress-btn');
  const resetBtn  = document.getElementById('reset-btn');
  const crfSlider = document.getElementById('crf');
  const crfVal    = document.getElementById('crf-val');
  const targetSizeSelect = document.getElementById('target-size');
  const crfField  = document.getElementById('crf-field');
  const progWrap  = document.getElementById('progress-wrap');
  const progBar   = document.getElementById('progress-bar');
  const progLabel = document.getElementById('progress-label');
  const outSec    = document.getElementById('output-section');
  const outMeta   = document.getElementById('out-meta');
  const dlBtn     = document.getElementById('download-btn');
  const previewVideo = document.getElementById('preview-video');

  // ── Logging ───────────────────────────────────────────────────────────────
  function log(msg, cls = '') {
    const line = document.createElement('div');
    line.innerHTML = `<span class="log-accent">// </span>${msg}`;
    if (cls) line.classList.add(cls);
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(state, text) {
    dot.className = `status-dot ${state}`;
    statusTxt.textContent = text;
  }

  // ── Load FFmpeg engine ────────────────────────────────────────────────────
  async function loadFFmpeg() {
    setStatus('busy', 'LOADING FFMPEG ENGINE...');
    try {
      const coreURL   = await toBlobURL('./core/ffmpeg-core.js',  'text/javascript');
      const wasmURL   = await toBlobURL('./core/ffmpeg-core.wasm', 'application/wasm');
      const workerURL = await toBlobURL('./ffmpeg/worker.js',       'text/javascript');

      ffmpeg.on('log', ({ message }) => {
        log(message);
        // Try to parse duration from ffmpeg log
        const durationMatch = message.match(/Duration: (\d{2}):(\d{2}):(\d{2})\.(\d{2})/);
        if (durationMatch) {
          const hours = parseInt(durationMatch[1]);
          const mins = parseInt(durationMatch[2]);
          const secs = parseInt(durationMatch[3]);
          const ms = parseInt(durationMatch[4]);
          videoDuration = (hours * 3600) + (mins * 60) + secs + (ms / 100);
          log(`Detected Duration: ${videoDuration.toFixed(2)} seconds`, 'log-accent');
        }
      });

      ffmpeg.on('progress', ({ progress }) => {
        const pct = Math.round(progress * 100);
        progBar.style.width = `${pct}%`;
        progLabel.textContent = `${pct}%`;
      });

      await ffmpeg.load({ coreURL, wasmURL, workerURL });

      loaded = true;
      setStatus('ready', 'ENGINE READY');
      logEl.innerHTML = '';
      log('FFmpeg v0.12.6 loaded locally');
    } catch (e) {
      setStatus('error', 'LOAD FAILED');
      log(`Error loading FFmpeg: ${e.message}`, 'log-err');
    }
  }

  // ── File input ────────────────────────────────────────────────────────────
  crfSlider.addEventListener('input', () => { crfVal.textContent = crfSlider.value; });
  targetSizeSelect.addEventListener('change', () => {
    crfField.style.display = targetSizeSelect.value === 'auto' ? 'block' : 'none';
  });

  async function handleFile(file) {
    if (!file || !file.type.startsWith('video/')) { log('Not a video file', 'log-err'); return; }
    inputFile = file;
    dzName.textContent = `${file.name}  (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
    if (loaded) compBtn.disabled = false;
    log(`Loaded: ${file.name}`);
    
    // Probing duration by running a dummy command
    setStatus('busy', 'PROBING VIDEO...');
    const inputName = 'probe_' + file.name;
    await ffmpeg.writeFile(inputName, await fetchFile(file));
    await ffmpeg.exec(['-i', inputName]); // This will trigger the 'log' listener for Duration
    await ffmpeg.deleteFile(inputName);
    setStatus('ready', 'ENGINE READY');
  }

  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    handleFile(e.dataTransfer.files[0]);
  });

  // ── Compress ──────────────────────────────────────────────────────────────
  compBtn.addEventListener('click', async () => {
    if (!inputFile || !loaded) return;

    const targetMB = targetSizeSelect.value;
    const preset  = document.getElementById('preset').value;
    const scale   = document.getElementById('scale').value;
    const audio   = document.getElementById('audio').value;

    const inputName  = 'input.' + inputFile.name.split('.').pop();
    const outputName = `output.mp4`; 
    const randomId = Math.random().toString(36).substring(2, 7);
    
    compBtn.disabled = true;
    progWrap.style.display = 'block';
    progBar.style.width = '0%';
    outSec.style.display = 'none';
    logEl.innerHTML = '';

    setStatus('busy', 'COMPRESSING...');
    log(`Writing to virtual FS...`);

    try {
      await ffmpeg.writeFile(inputName, await fetchFile(inputFile));
      
      const args = ['-i', inputName];

      if (targetMB === 'auto') {
        const crf = crfSlider.value;
        args.push('-c:v', 'libx264', '-crf', crf, '-preset', preset);
      } else {
        // CALCULATE BITRATE
        // Bitrate (kbps) = (Target MB * 8192) / Duration
        // We use a 15% safety margin for headers/audio (multiplying by 0.85) to be lazy/safe
        const targetSizeKbits = parseFloat(targetMB) * 8192 * 0.85;
        let videoBitrate = Math.floor(targetSizeKbits / videoDuration);
        
        // Safety floor/ceiling
        if (videoBitrate < 100) videoBitrate = 100;
        
        log(`Targeting ${targetMB}MB over ${videoDuration.toFixed(1)}s`, 'log-accent');
        log(`Calculated Bitrate: ${videoBitrate} kbps`, 'log-accent');
        
        args.push('-c:v', 'libx264', '-b:v', `${videoBitrate}k`, '-maxrate', `${videoBitrate}k`, '-bufsize', `${videoBitrate * 4}k`, '-preset', preset);
      }

      if (scale !== 'original') args.push('-vf', `scale=${scale}:-2`);

      if (audio === 'none') {
        args.push('-an');
      } else if (audio !== 'copy') {
        args.push('-c:a', 'aac', '-b:a', audio);
      } else {
        args.push('-c:a', 'aac', '-b:a', '128k'); 
      }

      args.push('-movflags', '+faststart', '-y', outputName);
      
      log(`Running: ffmpeg ${args.join(' ')}`);
      await ffmpeg.exec(args);

      const data = await ffmpeg.readFile(outputName);
      const blob = new Blob([data.buffer], { type: `video/mp4` });

      if (outputURL) URL.revokeObjectURL(outputURL);
      outputURL = URL.createObjectURL(blob);

      const sizeMB = (blob.size / 1024 / 1024).toFixed(2);
      const savings = (((inputFile.size - blob.size) / inputFile.size) * 100).toFixed(1);

      currentOutputName = `${sizeMB}mb.video-${randomId}.mp4`;

      outMeta.innerHTML = `
        Target:  <span>${targetMB === 'auto' ? 'Auto' : targetMB + ' MB'}</span><br>
        Result:  <span>${sizeMB} MB</span> (Saved ${savings}%)<br>
        File:    <span>${currentOutputName}</span>
      `;

      previewVideo.src = outputURL;
      previewVideo.load();

      dlBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = outputURL;
        a.download = currentOutputName;
        a.click();
      };

      outSec.style.display = 'block';
      setStatus('ready', `DONE — ${sizeMB} MB`);
      progBar.style.width = '100%';
    } catch (e) {
      setStatus('error', 'FAILED');
      log(`Error: ${e.message}`, 'log-err');
    } finally {
      compBtn.disabled = false;
    }
  });

  resetBtn.addEventListener('click', () => location.reload());

  loadFFmpeg();
</script>
</body>
</html>
