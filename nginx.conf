events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Add WASM MIME type (not in default mime.types on alpine)
    types {
        application/wasm  wasm;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Serve everything from same origin — no CORS issues
        location / {
            try_files $uri $uri/ =404;
        }

        # Explicit headers for WASM files
        location ~* \.wasm$ {
            add_header Content-Type application/wasm;
            # Optional: cache aggressively since these files are large and static
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # JS files
        location ~* \.js$ {
            add_header Content-Type application/javascript;
        }
    }
}
